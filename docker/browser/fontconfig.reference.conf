<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Fontconfig does not understand BCP 47 script subtags: lang=zh-Hant-TW or
    zh-Hans-CN (what Chromium passes for <html lang="zh-Hant-TW">) match no
    orthography and fall through to the default CJK face (Japanese). Map them
    to fontconfig's own tags first; the Noto CJK rules below and in conf.d do
    the rest.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="lang" mode="assign" binding="same"><string>zh-tw</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <edit name="lang" mode="assign" binding="same"><string>zh-cn</string></edit>
  </match>
  <!-- Prefer Traditional Chinese glyphs only for matching language requests. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <!-- Preserve application choices and provide a color emoji fallback. -->
  <alias binding="weak">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
