# LensDock product Compose file. Operate it through `lensdock admin product-start` and
# `lensdock update compose`, never with a bare `docker compose`: the deployment adds its
# env file, the pinned image override and the update generation override.
# LENSDOCK_RUNTIME_IMAGE and LENSDOCK_GATEWAY_IMAGE select the images of a new installation
# (default: the published `latest`); `product-init` records them and the first
# `product-start` pins their digests. Source checkouts set them to the local :dev images.
name: lensdock-product

services:
  config-init:
    image: ${LENSDOCK_GATEWAY_IMAGE:-ghcr.io/jiaweixie/lensdock/gateway:latest}
    profiles: [setup]
    command: [prepare-config]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${LENSDOCK_STATE_DIR:-../.lensdock}/product:/source:ro
      - runtime-credentials:/prepared/runtime
      - gateway-credentials:/prepared/gateway
    healthcheck:
      disable: true

  runtime:
    image: ${LENSDOCK_RUNTIME_IMAGE:-ghcr.io/jiaweixie/lensdock/runtime:latest}
    hostname: runtime
    init: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=0755
      - /home/browser:uid=10001,gid=10001,mode=0700
    shm_size: 1gb
    # No default cap. Set LENSDOCK_RUNTIME_MEMORY_LIMIT (for example 4g) and
    # LENSDOCK_RUNTIME_CPUS in compose.env to opt in; 0 means unlimited.
    mem_limit: ${LENSDOCK_RUNTIME_MEMORY_LIMIT:-0}
    cpus: ${LENSDOCK_RUNTIME_CPUS:-0}
    # Optional process cap: LENSDOCK_RUNTIME_PIDS_LIMIT (0 means unlimited).
    pids_limit: ${LENSDOCK_RUNTIME_PIDS_LIMIT:-0}
    cap_drop: [ALL]
    # Only root tini retains KILL, to forward stop signals after the runtime drops UID.
    cap_add: [CHOWN, SETUID, SETGID, SETPCAP, KILL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser/seccomp/chromium.json
    env_file:
      - ${LENSDOCK_STATE_DIR:-../.lensdock}/runtime.env
    environment:
      LENSDOCK_WORKSPACE_ID: ${LENSDOCK_WORKSPACE_ID:-default}
      LENSDOCK_MODE: ${LENSDOCK_MODE:-AGENT}
      LENSDOCK_TLS_CERT_FILE: /run/lensdock-credentials/runtime.crt
      LENSDOCK_TLS_KEY_FILE: /run/lensdock-credentials/runtime.key
      LENSDOCK_TLS_CLIENT_CA_FILE: /run/lensdock-credentials/ca.crt
      LENSDOCK_TLS_CLIENT_NAMES: gateway
    volumes:
      - lensdock-profile:/data/profile
      - lensdock-downloads:/data/downloads
      - lensdock-runtime-policy:/data/runtime
      - runtime-credentials:/run/lensdock-credentials:ro
    networks: [control, browser-egress]
    stop_grace_period: 30s

  gateway:
    image: ${LENSDOCK_GATEWAY_IMAGE:-ghcr.io/jiaweixie/lensdock/gateway:latest}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    # No default cap. Set LENSDOCK_GATEWAY_MEMORY_LIMIT (for example 1g) and
    # LENSDOCK_GATEWAY_CPUS in compose.env to opt in; 0 means unlimited.
    mem_limit: ${LENSDOCK_GATEWAY_MEMORY_LIMIT:-0}
    cpus: ${LENSDOCK_GATEWAY_CPUS:-0}
    # Optional process cap: LENSDOCK_GATEWAY_PIDS_LIMIT (0 means unlimited).
    pids_limit: ${LENSDOCK_GATEWAY_PIDS_LIMIT:-0}
    environment:
      LENSDOCK_HEALTH_ORIGIN: ${LENSDOCK_PUBLIC_ORIGIN:-http://127.0.0.1:18081}
      # Local browsers enter automatically unless pairing is explicitly required.
      LENSDOCK_REQUIRE_PAIRING: ${LENSDOCK_REQUIRE_PAIRING:-}
      LENSDOCK_FEEDBACK_MAX_IMAGE_BYTES: ${LENSDOCK_FEEDBACK_MAX_IMAGE_BYTES:-}
      LENSDOCK_FEEDBACK_MAX_PIXELS: ${LENSDOCK_FEEDBACK_MAX_PIXELS:-}
      LENSDOCK_FEEDBACK_MAX_DIMENSION: ${LENSDOCK_FEEDBACK_MAX_DIMENSION:-}
      LENSDOCK_FEEDBACK_MAX_JSON_BYTES: ${LENSDOCK_FEEDBACK_MAX_JSON_BYTES:-}
      LENSDOCK_FEEDBACK_DRAFT_TTL_SECONDS: ${LENSDOCK_FEEDBACK_DRAFT_TTL_SECONDS:-}
      LENSDOCK_FEEDBACK_MAX_DRAFTS: ${LENSDOCK_FEEDBACK_MAX_DRAFTS:-}
      LENSDOCK_FEEDBACK_MAX_OPEN_CAPTURES: ${LENSDOCK_FEEDBACK_MAX_OPEN_CAPTURES:-}
      LENSDOCK_FEEDBACK_MAX_PRIVATE_BYTES: ${LENSDOCK_FEEDBACK_MAX_PRIVATE_BYTES:-}
      LENSDOCK_FEEDBACK_MAX_SHARED_BYTES: ${LENSDOCK_FEEDBACK_MAX_SHARED_BYTES:-}
      LENSDOCK_FEEDBACK_MAX_EFFECT_PIXELS: ${LENSDOCK_FEEDBACK_MAX_EFFECT_PIXELS:-}
      LENSDOCK_RUNTIME_TRANSFER_TIMEOUT_SECONDS: ${LENSDOCK_RUNTIME_TRANSFER_TIMEOUT_SECONDS:-}
    ports:
      - "127.0.0.1:${LENSDOCK_HOST_PORT:-18081}:8080"
    volumes:
      - gateway-db:/data/db
      - gateway-private:/data/private
      - gateway-artifacts:/data/artifacts
      - gateway-credentials:/run/lensdock:ro
      - ${LENSDOCK_STATE_DIR:-../.lensdock}/product/public:/run/lensdock-status:ro
      # The host directory of published browser destinations is mounted read-only at
      # /run/lensdock-destinations by destinations.yaml, an override that
      # `lensdock admin product-start` adds beside this file (so release copies of this
      # file that predate the mount gain it too). It holds only non-secret metadata.
    networks: [control, gateway-edge]
    depends_on:
      runtime:
        condition: service_healthy
    stop_grace_period: 30s

networks:
  control:
    internal: true
  browser-egress: {}
  gateway-edge: {}

volumes:
  lensdock-profile:
  lensdock-downloads:
  lensdock-runtime-policy:
  gateway-db:
  gateway-private:
  gateway-artifacts:
  runtime-credentials:
  gateway-credentials:
