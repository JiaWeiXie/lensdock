# git-cliff configuration for LensDock releases.
#
# Used by tools/release/version.sh (next version) and tools/release/notes.sh
# (GitHub release notes) from .github/workflows/release.yml. No CHANGELOG file
# is generated or committed; the release notes are the changelog.
#
# Versioning policy (Conventional Commits on main):
#   feat            -> minor
#   everything else -> patch
#   breaking (`!` or a BREAKING CHANGE footer) -> minor while the major version is 0
# The first public release is 0.3.0. Before 1.0.0 a breaking change bumps the
# minor version. To cut 1.0.0 deliberately, set breaking_always_bump_major to
# true in the same change that carries the breaking commit; once the major
# version is 1 or higher the flag no longer matters.

[bump]
initial_tag = "v0.3.0"
features_always_bump_minor = true
breaking_always_bump_major = false

[changelog]
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking %} (**BREAKING**){% endif %} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"
# Only strict stable tags are release tags.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Styling" },
  { message = "^(build|ci|chore)", group = "<!-- 8 -->Maintenance" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
