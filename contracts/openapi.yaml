          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: AGENT_MODE_DISABLED. The workspace is in NOVNC mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: UPSTREAM_UNAVAILABLE. The pause was not confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
