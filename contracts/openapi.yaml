  /api/v1/workspaces/{workspaceId}/agent/events:
    get:
      operationId: streamAgentControl
      summary: Subscribe to usage-mode and pause changes
      description: 'Server-sent events. Each event is `event: agent-control` with the
        AgentControl JSON as data and the revision as id; the current state comes
        first. The stream carries no feedback or private data and stays open in NOVNC
        mode and while paused, so an Agent hears about a resume. A client that loses
        the stream must reconnect and must not read silence as permission. The Gateway
        ends it on shutdown.'
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
