        records that the agent says it received and read the revision, and it
        grants no browser control: working on the feedback starts only when an
        Agent lease is acquired with feedbackId. Listing, reading and
        downloading a revision never acknowledge it, and queueing a revision
        is not evidence that any agent read it. Cookie-authenticated mutations
        also require CSRF protection.
