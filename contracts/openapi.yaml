              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: lensdock-session-{namespace}
      description: >-
        The name is a template: namespace is the first 16 bytes of SHA-256,
        encoded as 32 lowercase hexadecimal characters, of the UTF-8 string
        "lensdock-cookie-namespace-v1" + NUL + configured origin + NUL +
        deploymentId. Browsers use the actual Set-Cookie name. Session and
        demo-signout cookies are scoped independently by exact origin and
        deployment identity; legacy unscoped cookies are not accepted.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 4096
        message:
          type: string
          minLength: 1
          maxLength: 4096
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - message
      - requestId
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        runtimeGeneration:
          type: string
          minLength: 1
          maxLength: 128
        controlState:
          enum:
          - IDLE
          - HUMAN
          - AGENT
          - HANDOFF_PENDING
          - CAPTURE
          - MAINTENANCE
          - ERROR_LOCKED
        holderId:
          type:
          - string
          - 'null'
        ready:
          type: boolean
        agentControl:
          $ref: '#/components/schemas/AgentControl'
      required:
      - id
      - runtimeGeneration
      - controlState
      - holderId
      - ready
      - agentControl
    AgentControl:
      type: object
      description: Authoritative usage policy of a workspace, owned by the Browser
        Runtime. It is separate from controlState. paused is always false in NOVNC
        mode. revision grows by one for every change of mode or paused. A client
        that cannot read a valid AgentControl must treat Agent features as unavailable,
        never as AGENT.
      additionalProperties: false
      properties:
        mode:
          enum:
          - NOVNC
          - AGENT
        paused:
          type: boolean
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
      required:
      - mode
      - paused
      - revision
      - updatedAt
    SetAgentMode:
      type: object
      additionalProperties: false
      properties:
        mode:
          enum:
          - NOVNC
          - AGENT
      required:
      - mode
    AgentSetup:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          description: English onboarding prompt for an Agent. Built from the configured
            origin and the workspace ID only; it never contains a token, session
            cookie or lease.
      required:
      - prompt
    AcquireLease:
      type: object
      additionalProperties: false
      properties:
        mode:
          enum:
          - HUMAN
          - AGENT
        ttlSeconds:
          type: integer
          minimum: 10
          maximum: 120
          default: 30
        feedbackId:
          type: string
          pattern: ^[A-Za-z0-9._~:-]{1,128}$
          description: Agent mode only. The acknowledged feedback this lease begins
            work on; the assigned agent's revision moves to IN_PROGRESS on success.
        feedbackRevision:
          type: integer
          minimum: 1
          description: Optional, and only together with feedbackId. Omit it when exactly
            one acknowledged or in-progress revision of the feedback is assigned
            to the caller; name it when several are active.
      required:
      - mode
      dependentRequired:
        feedbackRevision:
        - feedbackId
      allOf:
      - if:
          required:
          - feedbackId
        then:
          properties:
            mode:
              const: AGENT
    Lease:
      type: object
      additionalProperties: false
      properties:
        leaseId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
        holderId:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          enum:
          - HUMAN
          - AGENT
        epoch:
          type: integer
          minimum: 1
        runtimeGeneration:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
      - leaseId
      - workspaceId
      - holderId
      - mode
      - epoch
      - runtimeGeneration
      - expiresAt
    LeaseView:
      type: object
      description: Reply to a cookie-authenticated acquireLease. The Gateway keeps
        the capability token on the server for that session, so none is returned.
      additionalProperties: false
      properties:
        lease:
          $ref: '#/components/schemas/Lease'
      required:
      - lease
    LeaseGrant:
      type: object
      additionalProperties: false
      properties:
        lease:
          $ref: '#/components/schemas/Lease'
        capabilityToken:
          type: string
          minLength: 16
          maxLength: 8192
      required:
      - lease
      - capabilityToken
    RenewLease:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          minimum: 1
        runtimeGeneration:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - epoch
      - runtimeGeneration
    Takeover:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        force:
          type: boolean
          default: false
      required:
      - reason
    TakeoverPending:
      type: object
      additionalProperties: false
      properties:
        status:
          const: HANDOFF_PENDING
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - status
      - requestId
    MaintenanceRequest:
      description: >-
        Body of the Runtime operator route POST /api/v1/workspaces/{workspaceId}/maintenance
        (not served by the Gateway as a core flow operation). Without ifIdle the
        request fences any live control lease and enters MAINTENANCE. With
        ifIdle true the Runtime enters MAINTENANCE only when the control domain is
        idle for exactly expectedGeneration: a live HUMAN or AGENT lease, a
        takeover, a capture or an existing maintenance is refused (409
        LEASE_CONFLICT or MAINTENANCE) and a different current generation is
        refused (412 GENERATION_MISMATCH), each without changing any control
        state. ifIdle guards the control domain only, not browser pages,
        downloads or noVNC viewers; the caller has already accepted losing them.
        expectedGeneration without ifIdle true is invalid (400).
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        ifIdle:
          type: boolean
          default: false
        expectedGeneration:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - reason
      allOf:
      - if:
          properties:
            ifIdle:
              const: true
          required:
          - ifIdle
        then:
          required:
          - expectedGeneration
        else:
          not:
            required:
            - expectedGeneration
    CreateCapture:
      type: object
      additionalProperties: false
      properties:
        source:
          enum:
          - desktop
          - page-viewport
          - drawing
        targetId:
          type: string
          minLength: 1
          maxLength: 256
        leaseId:
          type: string
          minLength: 1
          maxLength: 128
        allowInterrupt:
          type: boolean
        imageWidthPx:
          type: integer
          minimum: 64
          maximum: 4096
        imageHeightPx:
          type: integer
          minimum: 64
          maximum: 4096
      required:
      - source
      allOf:
      - if:
          properties:
            source:
              const: page-viewport
          required:
          - source
        then:
          required:
          - targetId
          - leaseId
          not:
            anyOf:
            - required:
              - imageWidthPx
            - required:
              - imageHeightPx
      - if:
          properties:
            source:
              const: desktop
          required:
          - source
        then:
          not:
            anyOf:
            - required:
              - targetId
            - required:
              - leaseId
            - required:
              - allowInterrupt
            - required:
              - imageWidthPx
            - required:
              - imageHeightPx
      - if:
          properties:
            source:
              const: drawing
          required:
          - source
        then:
          required:
          - imageWidthPx
          - imageHeightPx
          not:
            anyOf:
            - required:
              - targetId
            - required:
              - leaseId
            - required:
              - allowInterrupt
    CaptureState:
      type: object
      additionalProperties: false
      properties:
        captureId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
        status:
          enum:
          - awaiting-upload
          - capturing
          - ready
          - failed
        consistency:
          enum:
          - stable-navigation
          - best-effort
          - unknown
        source:
          enum:
          - desktop
          - page-viewport
          - page-full
          - drawing
        provenance:
          enum:
          - client-framebuffer
          - runtime-cdp
          - generated-canvas
        imageWidthPx:
          type: integer
          minimum: 1
          maximum: 32768
        imageHeightPx:
          type: integer
          minimum: 1
          maximum: 32768
        capturedAt:
          type: string
          format: date-time
        serverReceivedAt:
          type: string
          format: date-time
        runtimeGeneration:
          type: string
          minLength: 0
          maxLength: 128
          description: Empty only for a drawing, which has no runtime.
        targetId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
        navigationId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
        page:
          $ref: ../schemas/feedback.schema.json#/$defs/capture/properties/page
        parentTransform:
          type: object
          description: Present on a crop or a revision base; a derived capture keeps the
            source, provenance and context of its parent, so a crop of a drawing is still
            a drawing.
        feedbackId:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
      required:
      - captureId
      - workspaceId
      - status
      - consistency
    CreateDraft:
      type: object
      additionalProperties: false
      properties:
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
        captureId:
          type: string
          minLength: 1
          maxLength: 128
        task:
          $ref: ../schemas/feedback.schema.json#/$defs/draftTask
      required:
      - workspaceId
      - captureId
      - task
    PatchDraft:
      type: object
      additionalProperties: false
      properties:
        task:
          $ref: ../schemas/feedback.schema.json#/$defs/draftTask
        annotations:
          type: array
          maxItems: 100
          items:
            $ref: ../schemas/feedback.schema.json#/$defs/annotation
      required: []
    Draft:
      type: object
      additionalProperties: false
      properties:
        feedbackId:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
          minLength: 1
          maxLength: 128
        state:
          const: DRAFT
      required:
      - feedbackId
      - revision
      - etag
      - state
    Publish:
      type: object
      additionalProperties: false
      properties:
        humanApproved:
          const: true
        dispatch:
          type: boolean
          default: false
          description: >-
            Opt in to publish and queue in one atomic step. The server resolves
            the recipient (never sent by the client): the workspace's
            administratively configured default agent, or its only configured
            agent. Omitted or false keeps the revision READY.
      required:
      - humanApproved
    PublishedFeedback:
      $ref: ../schemas/feedback.schema.json
    Dispatch:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Optional operator override. Must be a configured agent identity of
            the revision's workspace. When omitted the server resolves the
            workspace's default or only configured agent.
      required:
      - revision
    Acknowledge:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
      required:
      - revision
    Resolve:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 12000
        verification:
          type: string
          minLength: 1
          maxLength: 12000
        resultFeedbackIds:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 128
      required:
      - revision
      - summary
      - verification
    Verify:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        outcome:
          enum:
          - verified
          - rejected
        reason:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - revision
      - outcome
      allOf:
      - if:
          properties:
            outcome:
              const: rejected
          required:
          - outcome
        then:
          required:
          - reason
    Cancel:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - revision
    Delivery:
      type: object
      additionalProperties: false
      properties:
        feedbackId:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1
        agentId:
          type: string
          minLength: 1
          maxLength: 128
        state:
          enum:
          - QUEUED
          - ACKNOWLEDGED
          - IN_PROGRESS
          - RESOLVED
          - VERIFIED
          - CANCELLED
      required:
      - feedbackId
      - revision
      - agentId
      - state
    FeedbackSummary:
      type: object
      additionalProperties: false
      properties:
        feedbackId:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
        deliveryState:
          enum:
          - READY
          - QUEUED
          - ACKNOWLEDGED
          - IN_PROGRESS
          - RESOLVED
          - VERIFIED
          - CANCELLED
      required:
      - feedbackId
      - revision
      - workspaceId
      - title
      - deliveryState
    FeedbackList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FeedbackSummary'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    DraftDetail:
      type: object
      additionalProperties: false
      properties:
        feedbackId:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
          minLength: 1
          maxLength: 128
        state:
          const: DRAFT
        captureId:
          type: string
          minLength: 1
          maxLength: 128
        task:
          $ref: ../schemas/feedback.schema.json#/$defs/draftTask
        annotations:
          type: array
          maxItems: 100
          items:
            $ref: ../schemas/feedback.schema.json#/$defs/annotation
        previewReady:
          type: boolean
      required:
      - feedbackId
      - revision
      - etag
      - state
      - captureId
      - task
      - annotations
      - previewReady
