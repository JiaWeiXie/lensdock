  /api/v1/workspaces/{workspaceId}/agent:
    get:
      operationId: getAgentControl
      summary: Read the usage mode and pause state
      description: Any role scoped to the workspace, including an Agent in NOVNC
        mode. The Runtime owns the state and the Gateway reads it on every gated
        request.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControl'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The workspace ID in the path does not name this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: UPSTREAM_UNAVAILABLE. The policy could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: setAgentMode
      summary: Switch between NOVNC (browser only) and AGENT
      description: Human or administrator only. NOVNC disconnects the Agent, closes
        its lease, tickets and sockets, removes its Gateway grants, ends open feedback
        subscriptions and downloads, and clears pause. Enabling AGENT starts unpaused
        and never revives an earlier lease. A page action the Agent sent before the
        switch cannot be undone. The mode set here wins over the startup flag or
        environment value, which only seeds a workspace with no saved policy.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentMode'
      responses:
        '200':
          description: The state after the change, or unchanged for the same mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControl'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: UPSTREAM_UNAVAILABLE. The change was not confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspaces/{workspaceId}/agent/pause:
    post:
      operationId: pauseAgent
      summary: Pause the Agent immediately
      description: Human or administrator only, body {}. No confirmation. The Runtime
        fences the Agent lease and closes its tickets and sockets. No lease can be
        granted or renewed until resume. A HUMAN lease is untouched, and feedback
        stays open to humans and to the assigned Agent. Idempotent.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
