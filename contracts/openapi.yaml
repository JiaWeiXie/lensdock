openapi: 3.1.0
info:
  title: LensDock Core API
  version: 0.1.0-draft
  description: >-
    Core flow contract of the LensDock Gateway. The Gateway serves every
    operation in this file from one origin. The web UI authenticates with the
    sessionCookie scheme (pairing, login and logout at /api/v1/session are not
    described here; with the opt-in local demo no-auth, see
    README.md#local-demo-without-token-entry, a same-origin browser fetch of GET /api/v1/session
    also starts a workspace-scoped human demo session) and the CLI, MCP server and Agents authenticate with
    bearerAuth. The Browser Runtime implements getWorkspace, acquireLease,
    renewLease and releaseLease itself and accepts bearer tokens only; in the
    full product only the Gateway reaches it, over mutual TLS. The Gateway
    also serves routes this file does not list: GET /healthz and /readyz,
    /api/v1/session, /api/v1/system, /api/v1/audit, GET /api/v1/workspaces,
    the workspace routes health, targets, files, resolution, clipboard,
    maintenance, vnc/view, vnc/control and the lease-scoped cdp/ proxy, and
    the feedback routes for crop, draft list and delete, revisions, delivery
    state, manifest, bundle download and the private capture image. Their
    absence here says nothing about whether they are supported. The Runtime
    and the feedback routes answer a wrong method on a known path with 405
    METHOD_NOT_ALLOWED and an Allow header. Full-page capture (page-full)
    and multi-image feedback are not implemented.
servers:
- url: /
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /api/v1/deployment:
    get:
      operationId: getDeploymentIdentity
      summary: Read the non-secret Gateway deployment identity
      description: >-
        Requires the configured Host but no credential. A managed client checks
        the owned published port and this exact identity before reading or sending
        its Gateway credential. Redirects are not a valid identity response.
        Standalone Gateways may return an empty deploymentId.
      security: []
      responses:
        '200':
          description: The identity configured for this Gateway.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deploymentId]
                properties:
                  deploymentId:
                    type: string
                    maxLength: 64
                    pattern: '^(?:[A-Za-z0-9][A-Za-z0-9_-]{0,63})?$'
        '405':
          description: METHOD_NOT_ALLOWED. Only GET is supported.
  /api/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Read workspace and control state
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The workspace ID in the path does not name this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspaces/{workspaceId}/leases:
    post:
      operationId: acquireLease
      summary: Acquire a single-writer lease
      description: >-
        The authenticated identity is the holder. A bearer-authenticated
        caller receives the capability token once and must not log it; a
        cookie-authenticated browser session receives only the lease, because
        the Gateway keeps the token on the server. Agent mode grants
        high-trust browser control, not read-only CDP. Idempotency-Key must be
        1-256 printable ASCII characters. The Runtime never replays a grant:
        reusing the key of the still-active lease returns 409
        IDEMPOTENCY_REPLAY without a token, and any other key while a lease is
        held returns 409 LEASE_CONFLICT. An Agent lease may name the feedback
        it starts work on with feedbackId and an optional feedbackRevision.
        The Gateway then requires that the calling agent is the assigned agent
        and that the revision is ACKNOWLEDGED (or already IN_PROGRESS). When
        feedbackRevision is omitted, feedbackId must have exactly one
        acknowledged or in-progress revision assigned to the caller; with
        several the request fails and the revision must be named. A
        successful grant moves the revision to IN_PROGRESS. A HUMAN lease
        with feedbackId, and feedbackRevision without feedbackId, return 400
        INVALID_REQUEST. A failed feedback precondition returns 409
        FEEDBACK_CONFLICT before any lease exists; a failed transition after
        the grant revokes the lease and returns 409 FEEDBACK_CONFLICT.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LeaseGrant'
                - $ref: '#/components/schemas/LeaseView'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The workspace ID in the path does not name this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireLease'
  /api/v1/workspaces/{workspaceId}/leases/{leaseId}/renew:
    post:
      operationId: renewLease
      summary: Renew the current lease
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: leaseId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The workspace ID in the path does not name this workspace, or the lease ID is not the current lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLease'
  /api/v1/workspaces/{workspaceId}/leases/{leaseId}:
    delete:
      operationId: releaseLease
      summary: Revoke the lease and close control connections
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: leaseId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '204':
          description: Success
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The workspace ID in the path does not name this workspace, or the lease ID is not the current lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/workspaces/{workspaceId}/takeover:
    post:
      operationId: requestTakeover
      summary: Start a human takeover
      description: Human-operator authorization is required. No new control grant
        is issued before the old writer is fenced. Poll workspace state for completion.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeoverPending'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Takeover'
  /api/v1/workspaces/{workspaceId}/captures:
    post:
      operationId: createCapture
      summary: Reserve a desktop capture, capture a CDP viewport, or create a blank drawing
      description: Desktop reservations require Human Operator workspace authorization
        and no lease; they never change lease state and await an authenticated PNG
        upload. CDP viewport capture requires targetId and the current human lease
        or an explicitly authorized capture lease. A drawing (source drawing) requires
        imageWidthPx and imageHeightPx, each an integer from 64 to 4096 within the
        shared pixel and size limits (413 IMAGE_TOO_LARGE above them; nothing is clipped
        or defaulted). The Gateway creates an opaque white PNG itself and answers with
        a ready private capture (provenance generated-canvas, empty runtimeGeneration,
        null targetId and navigationId, no page); it never contacts the browser runtime
        and takes no targetId, leaseId or allowInterrupt, so it works while the browser
        is unavailable. Authorization, ownership, Idempotency-Key and quotas are those
        of every capture.
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureState'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapture'
  /api/v1/captures/{captureId}:
    get:
      operationId: getCapture
      summary: Read authorized private capture status
      description: Private draft scope only. Published-feedback readers cannot use
        this endpoint to retrieve raw image data.
      parameters:
      - name: captureId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureState'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/captures/{captureId}/image:
    put:
      operationId: uploadDesktopCapture
      summary: Upload the PNG for a desktop capture reservation
      description: Only the reserving human identity can upload before reservation
        expiry. Enforce PNG decoding, dimension, size and memory limits. This is user-supplied
        framebuffer evidence.
      parameters:
      - name: captureId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureState'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
  /api/v1/feedback:
    post:
      operationId: createDraft
      summary: Create a private feedback draft
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraft'
    get:
      operationId: listPublishedFeedback
      summary: List authorized feedback revisions for a workspace
      description: Assigned agents see only their authorized deliveries. Filtering
        does not widen access. Drafts are not exposed by this endpoint.
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: cursor
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          enum:
          - READY
          - QUEUED
          - ACKNOWLEDGED
          - IN_PROGRESS
          - RESOLVED
          - VERIFIED
          - CANCELLED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackList'
        '401': &id001
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id002
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id003
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412': &id004
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/feedback/{feedbackId}:
    get:
      operationId: getPublishedFeedback
      summary: Read an authorized published revision
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFeedback'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchDraft
      summary: Update a private draft using an ETag
      description: Requires workspace-scoped authorization. Cookie-authenticated mutations
        also require CSRF protection.
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDraft'
  /api/v1/feedback/{feedbackId}/publish:
    post:
      operationId: publishFeedback
      summary: Publish an immutable human-approved share bundle
      description: >-
        Human-only operation. Re-encode and redact all shared images and
        derived artifacts before committing the revision atomically. The
        shared redacted image first has its solid redactions applied, then
        the blur and pixelate annotations in annotation order, then the solid
        redactions again, so overlapping effects never lighten a redaction.
        Blur and pixelate are cosmetic and are not redaction. Raw
        images never become share artifacts. A published revision is
        immutable: the database refuses to rewrite or delete it, and a change
        is a new revision. Every prose field of the task may be empty, and a
        blank title is published as "Visual feedback"; a supplied title and
        all other task text are published exactly as drafted and nothing is
        derived from the image. The published feedback.json, annotations.json,
        environment.json and manifest.json all carry the same schemaVersion.
        It is 0.3.0 when any annotation is a highlight, spotlight, blur or
        pixelate, an arrow has a control point, or a style uses opacity,
        effectSizePx, arrowStyle, textStyle or smoothing. Otherwise it is
        0.2.0 when the capture source is drawing, any annotation is an
        ellipse, diamond or line, or the task has no description (or, for a
        bug or visual-regression task, no expected or actual result), and
        0.1.0 in every other case, so earlier readers keep reading every
        revision whose content they can validate. With dispatch:true the same transaction
        also inserts the delivery as QUEUED (history DRAFT to READY to QUEUED
        and the assigned-only delivery.dispatched event) for the agent the
        server resolves from configuration, so publish and queue succeed or
        fail together. If no recipient can be resolved (no configured agent,
        a misconfigured default, or several agents without a default) the
        request fails with 409 AGENT_NOT_CONFIGURED or AGENT_AMBIGUOUS before
        anything is published and the draft stays open. The dispatch flag is
        part of the idempotency fingerprint: replaying one Idempotency-Key in
        the other mode is 409 IDEMPOTENCY_KEY_REUSED, and an identical retry
        returns the stored result without queueing twice. Queueing means
        authorized and visible to the agent only; it never claims the agent
        read or ran anything. Without dispatch the revision stays READY.
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedFeedback'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Publish'
  /api/v1/feedback/{feedbackId}/dispatch:
    post:
      operationId: dispatchFeedback
      summary: Queue an authorized revision for an agent
      description: >-
        Human-only (READY to QUEUED). Queues the latest published revision for
        the agent principal that may then read and acknowledge it; an older
        revision is rejected as superseded. The request body needs only the
        revision: when agentId is omitted the server resolves the recipient to
        the workspace's configured default agent, or to its only configured
        agent. Zero configured agents, a misconfigured default, or several
        agents without a default fail with 409 AGENT_NOT_CONFIGURED or
        AGENT_AMBIGUOUS and change nothing; the message tells the user to ask
        an administrator. An explicit agentId (operator use) must be a
        configured agent identity of the revision's workspace, else 400.
        Queueing does not reach into any running agent conversation.
        Cookie-authenticated mutations also require CSRF protection.
      parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or wrong workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lease or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Revision or generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate or resource limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dispatch'
  /api/v1/feedback/{feedbackId}/ack:
