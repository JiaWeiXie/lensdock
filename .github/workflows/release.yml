name: Release

# A release is cut by pushing a tag vX.Y.Z on a commit that is already on main;
# merging to main releases nothing. The only technical control is the repository's
# `v*` tag ruleset, which limits who can create, move or delete a release tag.
# Approval of each tag is a process rule (the maintainers' release procedure);
# GitHub has no human approval step for a private repository on this plan, and this
# workflow uses no deployment environment. See docs/UPDATE-RUNBOOK.md, "Cutting a
# release". Find the tag to push with `tools/release/version.sh`.
#
# The run first verifies the tag (tools/release/version.sh --check-tag): strict
# format, on main, newer than the previous release, and exactly the version computed
# from the Conventional Commits since it (cliff.toml). It then runs CI, builds the
# release assets and both container images natively on amd64 and arm64, scans and
# smoke-tests them, and only then publishes. Nothing is visible to users until every
# gate has passed:
#
#   ci + version -> bundles, images -> scan, smoke -> publish-images (version tags)
#                                                  -> release (GitHub release on the tag)
#                                                  -> latest (image tag `latest`)
#
# Images are first pushed untagged, by digest. Only the final jobs give them
# names, and `latest` moves last. A failed run leaves the tag but no published
# release; fix the cause and re-run the workflow for the same tag. A tag is never
# moved or reused: if the commit itself must change, push the next patch tag.
# No personal access token is used by the workflow: the release is created through
# the API with the workflow token, which does not trigger further workflows.
#
# Repository variables (optional): LENSDOCK_AMD64_RUNNER and LENSDOCK_ARM64_RUNNER
# replace the default runner labels, for example with a larger-runner label.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.next.outputs.should_release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: git-cliff@2.13.1
      - name: Verify the tag and compute the version
        id: next
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: tools/release/version.sh --check-tag "$RELEASE_TAG"
      - name: Summary
        env:
          REASON: ${{ steps.next.outputs.reason }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "Releasing **$VERSION**: $REASON" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No release: $REASON" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Changelog
        if: steps.next.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          mkdir changelog
          tools/release/notes.sh changelog --version "$VERSION" >changelog/changelog.md
      - name: Upload changelog
        if: steps.next.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changelog
          path: changelog/changelog.md
          if-no-files-found: error
          retention-days: 7

  bundles:
    name: Release assets
    needs: [version, ci]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8
          cache_key_prefix: mise-package
      - name: Build and verify the archives, SHA256SUMS and install.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: tools/release/package.sh --strict --version "$VERSION" --commit "$GITHUB_SHA" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  images:
    name: Images (${{ matrix.arch }})
    needs: [version, ci]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.LENSDOCK_AMD64_RUNNER || 'ubuntu-24.04' }}
          - arch: arm64
            runner: ${{ vars.LENSDOCK_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - name: The runner must be natively ${{ matrix.arch }}
        env:
          WANT: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) have=amd64 ;;
            aarch64) have=arm64 ;;
            *) have=$(uname -m) ;;
          esac
          if [ "$have" != "$WANT" ]; then
            echo "::error::this job builds linux/$WANT natively but the runner is $have; check the LENSDOCK_*_RUNNER variables"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=${REGISTRY}/${REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Build and push the runtime image by digest
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/browser/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ steps.names.outputs.base }}/runtime,push-by-digest=true,name-canonical=true,push=true
      - name: Build and push the gateway image by digest
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/gateway/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ steps.names.outputs.base }}/gateway,push-by-digest=true,name-canonical=true,push=true
      - name: Record the pushed digests
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          mkdir digests
          jq -n --arg arch "$ARCH" --arg runtime "$RUNTIME_DIGEST" --arg gateway "$GATEWAY_DIGEST" \
            '{arch: $arch, runtime: $runtime, gateway: $gateway}
             | if (.runtime | test("^sha256:[0-9a-f]{64}$")) and (.gateway | test("^sha256:[0-9a-f]{64}$")) then . else error("missing image digest") end' \
            >"digests/digests-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/digests-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  scan:
    name: Evidence and scan (${{ matrix.arch }})
    needs: [version, images]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.LENSDOCK_AMD64_RUNNER || 'ubuntu-24.04' }}
          - arch: arm64
            runner: ${{ vars.LENSDOCK_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: SBOM, provenance and vulnerability gate
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          base="${REGISTRY}/${REPOSITORY,,}"
          for name in runtime gateway; do
            digest=$(jq -er --arg name "$name" '.[$name]' "digests/digests-$ARCH.json")
            tools/release/image-evidence.sh "$name" "$base/$name@$digest" evidence "linux/$ARCH"
          done
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.arch }}
          path: evidence
          if-no-files-found: ignore
          retention-days: 90

  smoke:
    name: Fresh-install smoke (${{ matrix.arch }})
    needs: [version, bundles, images]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ vars.LENSDOCK_AMD64_RUNNER || 'ubuntu-24.04' }}
          - arch: arm64
            runner: ${{ vars.LENSDOCK_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which the
      # opt-in Chromium sandbox inside the container needs. This only relaxes the throwaway runner
      # host; the container keeps its seccomp profile, capability drop and no-new-privileges,
      # and the smoke test fails if the enabled sandbox would run without it.
      - name: Allow user namespaces on the runner host
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -r "$knob" ] && [ "$(cat "$knob")" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install the release in an isolated project and exercise it
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          SMOKE_DIST: dist
          SMOKE_VERSION: ${{ needs.version.outputs.version }}
          SMOKE_LOG_DIR: smoke-logs
        run: |
          base="${REGISTRY}/${REPOSITORY,,}"
          SMOKE_RUNTIME_IMAGE="$base/runtime@$(jq -er .runtime "digests/digests-$ARCH.json")" \
          SMOKE_GATEWAY_IMAGE="$base/gateway@$(jq -er .gateway "digests/digests-$ARCH.json")" \
            tools/release/smoke.sh
      - name: Upload the container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.arch }}
          path: smoke-logs
          if-no-files-found: ignore
          retention-days: 14

  publish-images:
    name: Publish image tags
    needs: [version, ci, bundles, images, scan, smoke]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform images and their version tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools/release/publish-images.sh tags --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --digests digests --out images.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-json
          path: images.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [version, bundles, publish-images]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
          path: changelog
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-json
          path: images
      - name: Compose the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools/release/notes.sh compose --version "$VERSION" \
            --changelog changelog/changelog.md --images images/images.json >release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools/release/publish-release.sh --version "$VERSION" --sha "$GITHUB_SHA" \
            --assets dist --notes release-notes.md

  latest:
    name: Move latest
    needs: [version, publish-images, release]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-json
          path: images
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject a stale retry before moving latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$newest" != "v$VERSION" ]; then
            echo "::error::refusing to replace latest with v$VERSION; the newest release is $newest"
            exit 1
          fi
      - name: Point latest at the released digests
        run: tools/release/publish-images.sh latest --images images/images.json
