name: CI

# Runs on pull requests and on every push to main, and is called by release.yml for
# every release tag, so a release is only built from commits that passed exactly
# these checks. Tool versions
# come from mise.toml and mise.lock (installed with --locked), the same pins that
# `mise run check` uses on a workstation.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: go,node,python,uv,shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.8
          cache_key_prefix: mise-check
      - name: mise run check
        run: mise run check
      - name: Shellcheck release scripts and installer
        run: shellcheck tools/release/*.sh install.sh
      - name: Dockerfile checks
        run: |
          docker buildx build --check -f docker/browser/Dockerfile .
          docker buildx build --check -f docker/gateway/Dockerfile .

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_ENABLE_TOOLS: node,pnpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.8
          cache_key_prefix: mise-web
      - name: Install, typecheck and build
        run: mise run web:build
      - name: Unit tests
        working-directory: apps/web
        run: pnpm test

  package:
    name: Release packaging dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_ENABLE_TOOLS: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.8
          cache_key_prefix: mise-package
      - name: Build and verify the release assets
        run: tools/release/package.sh --version 0.0.0-ci --out "$RUNNER_TEMP/dist"
      - name: The packaged CLI runs and reports its version
        run: |
          mkdir "$RUNNER_TEMP/extract"
          tar -xzf "$RUNNER_TEMP/dist/lensdock_0.0.0-ci_linux_amd64.tar.gz" -C "$RUNNER_TEMP/extract"
          got=$("$RUNNER_TEMP/extract/lensdock" version)
          want="lensdock 0.0.0-ci ($(git rev-parse HEAD))"
          if [ "$got" != "$want" ]; then
            echo "::error::lensdock version printed '$got', want '$want'"
            exit 1
          fi

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: git-cliff@2.13.1
      - name: Tag verification and release notes tests
        run: tools/release/version_test.sh
