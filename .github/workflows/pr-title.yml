name: PR Title

# The release version is computed from Conventional Commits on main (see cliff.toml).
# With squash merges the pull request title becomes the commit message, so it has to
# be a conventional commit. This workflow reads only the title; it never checks out
# or runs code from the pull request.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
