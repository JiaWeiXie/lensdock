# SPIKE-01 sandbox-matrix cell 2 (tests/e2e/sandbox-matrix.sh): the userns image under Docker's
# DEFAULT seccomp profile. The custom chromium.json is dropped but no-new-privileges stays.
# Expected: the namespace preflight fails, readyz stays false with SANDBOX_PREFLIGHT_FAILED and
# Chromium is never started (and never with --no-sandbox).
#   docker compose -f docker/browser/compose.yaml -f tests/e2e/compose.default-seccomp.yaml up -d
# `!override` replaces (not merges) the list and needs Docker Compose >= 2.24.
services:
  runtime:
    security_opt: !override
      - no-new-privileges:true
